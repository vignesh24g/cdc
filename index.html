<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDC Visual Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#18202c;font:14px system-ui,Segoe UI,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:18px 28px;background:linear-gradient(120deg,#ffffff,#fff7f8,#f4f8ff);border-bottom:1px solid #d9dee7;flex:none}
.brand{max-width:1450px;margin:auto;display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#d7192c;border:2px solid #ff6571;font-size:11px;font-weight:900;letter-spacing:.04em;color:#fff}
.brand h1{margin:0;font-size:19px}.brand p{margin:3px 0;color:#667085;font-size:11px}
.toplabs{max-width:1450px;margin:14px auto 0;padding:0 24px 14px;display:flex;gap:10px;flex:none;width:100%}
.toplabs button{padding:10px 18px;border-radius:10px;border:1px solid #dce1e8;background:#ffffff;color:#18202c;font-weight:900;font-size:12px;cursor:pointer}
.toplabs button.active{background:#d7192c;border-color:#ff4353;color:#fff}
.frame-wrap{flex:1;min-height:0;padding:0 0 0 0}
#labFrame{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header><div class="brand"><div class="logo">CDC</div><div><h1>CDC Visual Lab</h1><p>Single-table Change Data Capture · SCD1 · SCD2 · SCD3 · 2-Table Join</p></div></div></header>
<nav class="toplabs">
  <button id="tabSingleBtn" class="active" onclick="showLabTab('single')">Single-table CDC</button>
  <button id="tabJoinBtn" onclick="showLabTab('join')">2-Table CDC Join</button>
</nav>
<div class="frame-wrap"><iframe id="labFrame" src="single_table.html" title="CDC Visual Lab"></iframe></div>
<script>
function showLabTab(tab){
 document.getElementById("tabSingleBtn").classList.toggle("active",tab==="single");
 document.getElementById("tabJoinBtn").classList.toggle("active",tab==="join");
 document.getElementById("labFrame").src=tab==="single"?"single_table.html":"two_table.html";
}
</script>
</body></html>
